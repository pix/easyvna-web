name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.0.2
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet (linux, windows, darwin)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          GOOS=js GOARCH=wasm go vet ./...
      - name: test
        run: go test -race ./...
      - name: cross-build
        run: |
          for t in windows/amd64 windows/arm64 linux/arm64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null . || exit 1
          done
      - name: single-file browser version
        run: scripts/build-html.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.0.2
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: mock smoke test
        shell: pwsh
        run: |
          go build -o easyvna-web.exe .
          $p = Start-Process -FilePath .\easyvna-web.exe -ArgumentList '-mock','-no-browser','-listen','127.0.0.1:18080','-data','smoke-data' -PassThru
          Start-Sleep -Seconds 5
          $s = Invoke-RestMethod http://127.0.0.1:18080/api/state
          if (-not $s.connected) { throw "mock not connected" }
          $r = Invoke-RestMethod -Method Post http://127.0.0.1:18080/api/sweep
          if ($r.freq.Count -ne 401) { throw "unexpected sweep" }
          Stop-Process -Id $p.Id
